apiVersion: v1
kind: Pod
metadata:
  name: prod-web
  namespace: production
  labels:
    app: web
    tier: production
spec:
  containers:
  - name: web
    image: nginx:alpine
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: prod-web-service
  namespace: production
spec:
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: dev-client
  namespace: development
spec:
  containers:
  - name: client
    image: busybox
    command: ["sleep", "3600"]