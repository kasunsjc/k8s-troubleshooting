apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-hog
spec:
  replicas: 5
  selector:
    matchLabels:
      app: memory-hog
  template:
    metadata:
      labels:
        app: memory-hog
    spec:
      containers:
      - name: memory-consumer
        image: progrium/stress
        args: ["--vm", "1", "--vm-bytes", "512M", "--vm-hang", "1"]
        resources:
          requests:
            memory: "256Mi"
          limits:
            memory: "512Mi"