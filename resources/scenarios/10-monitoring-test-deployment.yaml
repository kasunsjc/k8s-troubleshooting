apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-test-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: monitoring-test
  template:
    metadata:
      labels:
        app: monitoring-test
    spec:
      containers:
      - name: variable-load
        image: busybox
        command:
        - sh
        - -c
        - |
          while true; do
            echo "Low load period"
            sleep 30
            echo "High load period"
            dd if=/dev/zero of=/dev/null bs=1M count=100 &
            sleep 30
            pkill dd
          done
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"