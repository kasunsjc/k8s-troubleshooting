apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota-violation-deployment
  namespace: resource-quota-test
spec:
  replicas: 4  # Exceeds pod quota of 3
  selector:
    matchLabels:
      app: quota-test
  template:
    metadata:
      labels:
        app: quota-test
    spec:
      containers:
      - name: app
        image: nginx:alpine
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"