apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpa-test-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vpa-test
  template:
    metadata:
      labels:
        app: vpa-test
    spec:
      containers:
      - name: app
        image: nginx:alpine
        resources:
          requests:
            cpu: "10m"     # Intentionally small
            memory: "16Mi" # Intentionally small
          limits:
            cpu: "50m"
            memory: "64Mi"