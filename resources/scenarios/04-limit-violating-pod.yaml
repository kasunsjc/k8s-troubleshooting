apiVersion: v1
kind: Pod
metadata:
  name: limit-violating-pod
  namespace: limitrange-test
spec:
  containers:
  - name: cpu-hog
    image: nginx:alpine
    resources:
      requests:
        cpu: "5m"      # Below minimum
        memory: "16Mi"  # Below minimum
      limits:
        cpu: "500m"    # Above maximum
        memory: "1Gi"   # Above maximum