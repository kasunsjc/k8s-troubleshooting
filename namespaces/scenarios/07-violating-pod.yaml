apiVersion: v1
kind: Pod
metadata:
  name: violating-pod
  namespace: limitrange-test
spec:
  containers:
  - name: app
    image: nginx:alpine
    resources:
      requests:
        cpu: "5m"      # Below minimum
        memory: "512Mi" # Above maximum
      limits:
        cpu: "300m"    # Above maximum
        memory: "1Gi"   # Above maximum