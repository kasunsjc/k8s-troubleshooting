apiVersion: v1
kind: LimitRange
metadata:
  name: limitrange-test-limits
  namespace: limitrange-test
spec:
  limits:
  - type: Container
    default:
      cpu: "100m"
      memory: "128Mi"
    defaultRequest:
      cpu: "50m"
      memory: "64Mi"
    min:
      cpu: "10m"
      memory: "32Mi"
    max:
      cpu: "200m"
      memory: "256Mi"