apiVersion: apps/v1
kind: Deployment
metadata:
  name: unready-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unready-app
  template:
    metadata:
      labels:
        app: unready-app
    spec:
      containers:
      - name: app
        image: nginx:alpine
        readinessProbe:
          httpGet:
            path: /health  # Non-existent endpoint
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: unready-service
spec:
  selector:
    app: unready-app
  ports:
  - port: 80
    targetPort: 80