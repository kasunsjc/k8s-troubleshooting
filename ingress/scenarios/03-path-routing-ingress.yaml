apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: path-routing-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: myapp.local
    http:
      paths:
      - path: /api
        pathType: Exact  # Wrong pathType for prefix matching
        backend:
          service:
            name: api-app
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-app
            port:
              number: 80