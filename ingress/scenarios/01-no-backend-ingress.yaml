apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: no-backend-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: test.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nonexistent-service
            port:
              number: 80