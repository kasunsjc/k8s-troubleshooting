apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: host-routing-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: prod.myapp.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prod-app
            port:
              number: 80
  - host: staging.myapp.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: staging-app
            port:
              number: 80