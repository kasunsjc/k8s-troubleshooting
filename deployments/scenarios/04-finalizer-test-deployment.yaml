apiVersion: apps/v1
kind: Deployment
metadata:
  name: finalizer-test
  finalizers:
    - example.com/test-finalizer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finalizer-test
  template:
    metadata:
      labels:
        app: finalizer-test
    spec:
      containers:
      - name: app
        image: nginx:alpine