apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: rbac-test-2
  name: cross-ns-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cross-ns-binding
  namespace: rbac-test-2
subjects:
- kind: ServiceAccount
  name: cross-ns-sa
  namespace: rbac-test  # Different namespace
roleRef:
  kind: Role
  name: cross-ns-role
  apiGroup: rbac.authorization.k8s.io