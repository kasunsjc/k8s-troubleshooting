apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: rbac-test
  name: specific-pod-access
rules:
- apiGroups: [""]
  resources: ["pods"]
  resourceNames: ["allowed-pod"]  # Only specific pod allowed
  verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: specific-pod-binding
  namespace: rbac-test
subjects:
- kind: ServiceAccount
  name: limited-sa
  namespace: rbac-test
roleRef:
  kind: Role
  name: specific-pod-access
  apiGroup: rbac.authorization.k8s.io