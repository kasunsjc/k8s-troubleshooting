apiVersion: v1
kind: Pod
metadata:
  name: config-test
  namespace: <namespace>
spec:
  containers:
  - name: test
    image: busybox
    command: ['sleep', '3600']
    volumeMounts:
    - name: config-volume
      mountPath: /etc/config
    - name: secret-volume
      mountPath: /etc/secret
    env:
    - name: CONFIG_VALUE
      valueFrom:
        configMapKeyRef:
          name: <configmap-name>
          key: <key>
    - name: SECRET_VALUE
      valueFrom:
        secretKeyRef:
          name: <secret-name>
          key: <key>
  volumes:
  - name: config-volume
    configMap:
      name: <configmap-name>
  - name: secret-volume
    secret:
      secretName: <secret-name>